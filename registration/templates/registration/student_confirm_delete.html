<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
</head>
<body>
    <h2>Delete Student</h2>
    <p>Are you sure you want to delete "{{ object }}"?</p>

    <form method="post">
        {% csrf_token %}
        
        <button type="submit">
            Confirm Delete
        </button>
    </form>

    <br>
    <a href="{% url 'student_list' %}">Cancel</a>
</body>
</html>
