<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>
    <h2>Registered Students</h2>

    <a href="{% url 'student_create' %}">
        Register Student
    </a>

    <table border="1" style="margin-top: 15px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student }}</td>
                <td>
                    <a href="{% url 'student_update' student.pk %}">
                        Edit
                    </a>
                    |
                    <a href="{% url 'student_delete' student.pk %}">
                        Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No students registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
