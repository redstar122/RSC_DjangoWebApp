<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Edit Student{% else %}Register Student{% endif %}</title>
</head>
<body>
    <h2>{% if object %}Edit Student{% else %}Register Student{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Save
        </button>
    </form>

    <br>
    <a href="{% url 'student_list' %}">Cancel</a>
</body>
</html>
